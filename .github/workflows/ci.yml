name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows build and extension checks
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore GameZ.Script.slnx --locked-mode
      - run: dotnet build GameZ.Script.slnx -c Release --no-restore
      - run: dotnet test --solution GameZ.Script.slnx -c Release --no-build
      - run: ./tools/package.ps1
      - run: npm run test:host
        working-directory: extension
